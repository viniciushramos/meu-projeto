name: Terraform CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply (somente na branch main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve

      - name: Smoke test (verificacao pos-deploy)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          sleep 5
          docker ps

      - name: Teste de estado do banco
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          until docker exec meu-container-db pg_isready -U postgres; do sleep 2; done
          sleep 8
          docker exec meu-container-db psql -U postgres -c "CREATE TABLE IF NOT EXISTS teste (msg text);"
          echo "Linhas ANTES de inserir:"
          docker exec meu-container-db psql -U postgres -c "SELECT count(*) FROM teste;"
          docker exec meu-container-db psql -U postgres -c "INSERT INTO teste VALUES ('dado da execucao');"
          echo "Linhas DEPOIS de inserir:"
          docker exec meu-container-db psql -U postgres -c "SELECT count(*) FROM teste;"